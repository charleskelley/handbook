# Tables the team relies on. One entry per table. `page` is its dataset page, or
# its domain page if it has no page of its own.
# Pages render these with macros, e.g. {{ data.datasets.example.freshness }}.
data:
  as_of: 2026-10-25
  datasets:
    example:
      name: Example fact table
      location: warehouse.schema.table
      grain: one row per <entity> per <period>
      primary_key: [entity_id, period]
      source_system: example-source   # where it is pulled from
      system_of_record: example-source   # authoritative system, may differ
      freshness: null          # e.g. "daily by 06:00 UTC"
      latency: null            # e.g. "T+1"
      retention: null          # e.g. "25 months"
      owner: platform-owner
      page: data/dataset-example.md
  source_systems:
    example-source:
      name: Example source system
      owner: null
      cadence: null
      contact: null
