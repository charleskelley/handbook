[project]
name = "example-model"
version = "0.1.0"
description = "Skeleton ML project: one recipe that runs in research and in production."
requires-python = ">=3.12"
dependencies = [
    "fsspec>=2024.6",
    "joblib>=1.4",
    "numpy>=2.0",
    "pandas>=2.2,<3",   # evidently 0.7 does not support pandas 3 yet
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
]

[project.optional-dependencies]
# Experiment tracking against the team MLflow server.
track = [
    "mlflow>=3.0",
]
# Google Cloud: BigQuery reads and writes, GCS, Vertex AI registry.
gcp = [
    "gcsfs>=2024.6",
    "google-cloud-aiplatform>=1.70",
    "google-cloud-bigquery[pandas]>=3.25",
]
# Monitoring: Vertex AI Model Monitoring is in the gcp extra; this adds the
# Evidently reports and Cloud Monitoring custom metrics.
monitor = [
    "evidently>=0.7",
    "google-cloud-monitoring>=2.22",
]
# Cloud Run serving.
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
# Vertex AI Pipelines definition and submission.
pipeline = [
    "kfp>=2.8",
]

[project.scripts]
example-model = "example_model.cli:main"

# Sends a Google identity token to the Cloud Run tracking server on every request.
[project.entry-points."mlflow.request_header_provider"]
example-model = "example_model.mlflow_auth:CloudRunHeaderProvider"

[dependency-groups]
dev = [
    "evidently>=0.7",
    "httpx>=0.27",
    "mlflow>=3.0",
    "nbstripout>=0.7",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

# --8<-- [start:uv]
[tool.uv]
# The package index is not set here. Each machine's uv.toml points the default
# index at Artifactory (written by the Mac bootstrap, the workstation image, or
# the research VM startup script), and CI sets UV_DEFAULT_INDEX.
default-groups = ["dev"]
# --8<-- [end:uv]

[tool.pytest.ini_options]
# No pythonpath entry for src/: tests import the installed package, so the same
# tests run against the source tree in development and against the published
# wheel in CI.
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
