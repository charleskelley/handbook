# The training recipe. Research and production both run this file, so changing
# it is a commit and a release, not a notebook edit.
table: your-prod-project.features.example_training  # the production feature table; dev reads it too
as_of: "2026-01-01"                                 # replace with the snapshot date
entity_id: entity_id
target: label
features: [f1, f2, f3, f3_ratio]                    # f3_ratio is built by features.py
params:
  C: 1.0
  max_iter: 1000
test_size: 0.2
seed: 0
monitoring:
  label_delay_days: 30   # labels arrive days to months after a prediction, by domain
  drift_threshold: 0.3
  alert_metric: roc_auc
  alert_floor: 0.7
  schedule: "0 6 * * *"
# The research run to reproduce. Written by `example-model reference <run_id>`.
# Production training fails until it is set, and fails if it is not reproduced.
reference:
  run_id: null
  fixture_uri: null
  fixture_digest: null
  metrics: {}
  tolerance: 0.02
  min_agreement: 0.95
