# Path to production. Merge requests and main run the checks. A version tag
# (v1.2.3) runs the release: build, publish to the dev repositories, test the
# published artifact, build the image from it, pass the gates, promote to the
# release repositories, deploy, and train in production.
#
# Placeholders to replace are in `variables`. Credentials are never stored:
# GitLab OIDC tokens are exchanged for short-lived Artifactory and Google tokens.

stages: [check, build, publish, verify, image, gate, promote, deploy, train, model]

variables:
  PACKAGE: example-model
  ARTIFACTORY_URL: https://artifactory.example.com
  ARTIFACTORY_HOST: artifactory.example.com
  JFROG_OIDC_PROVIDER: gitlab
  # Developers and production resolve from the release virtual repository; the
  # verify job also sees the dev repository, where untested builds live.
  PYPI_RELEASE_INDEX: $ARTIFACTORY_URL/artifactory/api/pypi/pypi/simple
  PYPI_DEV_INDEX: $ARTIFACTORY_URL/artifactory/api/pypi/pypi-dev/simple
  PYPI_DEV_LOCAL: pypi-dev-local
  PYPI_RELEASE_LOCAL: pypi-release-local
  DOCKER_DEV_LOCAL: docker-dev-local
  DOCKER_RELEASE_LOCAL: docker-release-local
  UV_DEFAULT_INDEX: $PYPI_RELEASE_INDEX
  UV_PYTHON_INSTALL_MIRROR: $ARTIFACTORY_URL/artifactory/github-releases/astral-sh/python-build-standalone/releases/download
  # CI images, pulled through the Artifactory Docker virtual repository.
  UV_IMAGE: $ARTIFACTORY_HOST/docker/astral-sh/uv:python3.12-bookworm-slim
  BASE_IMAGE: $ARTIFACTORY_HOST/docker/library/python:3.12-slim
  DOCKER_IMAGE: $ARTIFACTORY_HOST/docker/library/docker:27
  GCLOUD_IMAGE: $ARTIFACTORY_HOST/docker/google.com/cloudsdktool/google-cloud-cli:slim
  WORKBENCH_BASE_IMAGE: $ARTIFACTORY_HOST/docker/deeplearning-platform-release/workbench-container:latest
  # Production. GCP runtimes pull images through an Artifact Registry remote
  # repository that fronts the Artifactory release repository.
  PROD_PROJECT: your-prod-project
  REGION: us-central1
  RUNTIME_IMAGE: $REGION-docker.pkg.dev/$PROD_PROJECT/artifactory/$DOCKER_RELEASE_LOCAL/$PACKAGE
  GCP_WIF_PROVIDER: projects/000000000000/locations/global/workloadIdentityPools/gitlab/providers/gitlab
  GCP_SERVICE_ACCOUNT: deployer@your-prod-project.iam.gserviceaccount.com
  RUN_SERVICE_ACCOUNT: example-model-run@your-prod-project.iam.gserviceaccount.com
  PIPELINE_SERVICE_ACCOUNT: example-model-train@your-prod-project.iam.gserviceaccount.com
  PIPELINE_ROOT: gs://your-prod-pipelines/example-model
  MLFLOW_URL: https://mlflow.example.com   # the Cloud Run tracking server, set in CI/CD variables
  MODEL_BUCKET: gs://your-prod-models
  REPORTS_BUCKET: gs://your-prod-reports

.release:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

.artifactory:
  id_tokens:
    JFROG_OIDC_TOKEN:
      aud: $ARTIFACTORY_URL
  before_script:
    - . scripts/ci/artifactory-auth.sh

.gcp:
  id_tokens:
    JFROG_OIDC_TOKEN:
      aud: $ARTIFACTORY_URL
    GCP_OIDC_TOKEN:
      aud: https://iam.googleapis.com/$GCP_WIF_PROVIDER
  before_script:
    - . scripts/ci/artifactory-auth.sh
    - . scripts/ci/gcp-auth.sh

.uv:
  extends: .artifactory
  image: $UV_IMAGE

# ---------------------------------------------------------------- check

lint:
  stage: check
  extends: .uv
  script:
    - uv sync --locked
    - uv run ruff check .
    - uv run ruff format --check .

notebooks-have-no-outputs:
  stage: check
  extends: .uv
  script:
    - uv sync --locked
    - find notebooks -name '*.ipynb' -print0 | xargs -0 -r uv run nbstripout --verify

test:
  stage: check
  extends: .uv
  script:
    - uv sync --locked --extra serve
    - uv run pytest

# The Workbench notebook image, rebuilt from the lockfile on every main commit.
notebook-image:
  stage: build
  extends: .artifactory
  image: $DOCKER_IMAGE
  services: [{ name: "$DOCKER_IMAGE-dind", alias: docker }]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - IMAGE="$ARTIFACTORY_HOST/$DOCKER_DEV_LOCAL/$PACKAGE-notebook"
    - printf '%s' "$ARTIFACTORY_TOKEN" | docker login "$ARTIFACTORY_HOST" -u "${ARTIFACTORY_USER:-gitlab}" --password-stdin
    - docker build -f notebook-image/Dockerfile
        --build-arg UV_IMAGE="$UV_IMAGE" --build-arg BASE_IMAGE="$WORKBENCH_BASE_IMAGE"
        --build-arg INDEX_URL="$PYPI_RELEASE_INDEX" --secret id=netrc,src="$HOME/.netrc"
        -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:latest" .
    - docker push --all-tags "$IMAGE"

# ---------------------------------------------------------------- release

build:
  stage: build
  extends: [.uv, .release]
  script:
    - test "v$(uv version --short)" = "$CI_COMMIT_TAG"
    - uv build
  artifacts:
    paths: [dist/]

publish:
  stage: publish
  extends: [.uv, .release]
  needs: [build]
  script:
    - uv publish --publish-url "$ARTIFACTORY_URL/artifactory/api/pypi/$PYPI_DEV_LOCAL" dist/*

# Install the published wheel into a clean environment and run the tests against
# it. Proves the artifact works, not just the source tree.
verify-artifact:
  stage: verify
  extends: [.uv, .release]
  needs: [publish]
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - rm -rf src
    - uv run --isolated --no-project --index-url "$PYPI_DEV_INDEX"
        --with "$PACKAGE[serve]==$VERSION" --with pytest --with httpx
        pytest tests

image:
  stage: image
  extends: [.artifactory, .release]
  needs: [verify-artifact]
  image: $DOCKER_IMAGE
  services: [{ name: "$DOCKER_IMAGE-dind", alias: docker }]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - printf '%s' "$ARTIFACTORY_TOKEN" | docker login "$ARTIFACTORY_HOST" -u "${ARTIFACTORY_USER:-gitlab}" --password-stdin
    - docker build
        --build-arg UV_IMAGE="$UV_IMAGE" --build-arg BASE_IMAGE="$BASE_IMAGE"
        --build-arg INDEX_URL="$PYPI_DEV_INDEX" --build-arg PACKAGE_VERSION="$VERSION"
        --secret id=netrc,src="$HOME/.netrc"
        -t "$ARTIFACTORY_HOST/$DOCKER_DEV_LOCAL/$PACKAGE:$VERSION" .
    - docker push "$ARTIFACTORY_HOST/$DOCKER_DEV_LOCAL/$PACKAGE:$VERSION"

# Manual gate: run GPU tests by hand until GPU runners exist, then press play.
# The pipeline waits here; nothing is promoted until someone does.
gpu-tests:
  stage: gate
  extends: .release
  needs: [image]
  when: manual
  allow_failure: false
  script:
    - echo "Ran GPU tests for $CI_COMMIT_TAG; results linked in the merge request."

promote:
  stage: promote
  extends: [.uv, .release]
  needs: [gpu-tests]
  script:
    - python3 scripts/ci/promote.py "$PACKAGE" "${CI_COMMIT_TAG#v}"

deploy:
  stage: deploy
  extends: [.gcp, .release]
  needs: [promote]
  image: $GCLOUD_IMAGE
  environment: production
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - ENV_VARS="EXAMPLE_MODEL_GCP_PROJECT=$PROD_PROJECT,EXAMPLE_MODEL_REGION=$REGION,EXAMPLE_MODEL_MODEL_BUCKET=$MODEL_BUCKET"
    - gcloud run deploy "$PACKAGE" --project "$PROD_PROJECT" --region "$REGION"
        --image "$RUNTIME_IMAGE:$VERSION" --service-account "$RUN_SERVICE_ACCOUNT"
        --no-allow-unauthenticated --set-env-vars "$ENV_VARS"
    - gcloud run jobs deploy "$PACKAGE-score" --project "$PROD_PROJECT" --region "$REGION"
        --image "$RUNTIME_IMAGE:$VERSION" --service-account "$RUN_SERVICE_ACCOUNT"
        --command example-model
        --args "score,--input-table,$PROD_PROJECT.scoring.input,--output-table,$PROD_PROJECT.scoring.output"
        --set-env-vars "$ENV_VARS"
    # Monitoring jobs, started by Cloud Scheduler (Terraform): labeled performance
    # weekly, and the Evidently report weekly.
    - gcloud run jobs deploy "$PACKAGE-performance" --project "$PROD_PROJECT" --region "$REGION"
        --image "$RUNTIME_IMAGE:$VERSION" --service-account "$RUN_SERVICE_ACCOUNT"
        --command example-model --args "performance,--days,7" --set-env-vars "$ENV_VARS"
    - gcloud run jobs deploy "$PACKAGE-report" --project "$PROD_PROJECT" --region "$REGION"
        --image "$RUNTIME_IMAGE:$VERSION" --service-account "$RUN_SERVICE_ACCOUNT"
        --command example-model --args "report,--days,7"
        --set-env-vars "$ENV_VARS,EXAMPLE_MODEL_REPORTS_BUCKET=$REPORTS_BUCKET"

# Training in production, started by hand: the first rung of the ladder. Later
# rungs replace `when: manual` with a schedule, then a drift or data trigger.
train:
  stage: train
  extends: [.gcp, .release]
  needs: [promote]
  image: $UV_IMAGE
  when: manual
  variables:
    EXAMPLE_MODEL_GCP_PROJECT: $PROD_PROJECT
    EXAMPLE_MODEL_REGION: $REGION
    EXAMPLE_MODEL_MODEL_BUCKET: $MODEL_BUCKET
    EXAMPLE_MODEL_TRACKING_URI: $MLFLOW_URL
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - uv run --isolated --no-project --index-url "$PYPI_RELEASE_INDEX"
        --with "$PACKAGE[gcp,pipeline]==$VERSION"
        example-model submit-training --image "$RUNTIME_IMAGE:$VERSION"
        --model-version "$VERSION" --service-account "$PIPELINE_SERVICE_ACCOUNT"
        --root "$PIPELINE_ROOT"

# Promotion is manual: a person runs this with the registry version that passed
# review. It moves the champion alias and creates the Vertex AI Model Monitoring
# monitor for that version. Triggered retraining, when it comes, submits the
# train job above; it never promotes.
promote-model:
  stage: model
  extends: [.gcp, .release]
  needs: [train]
  image: $UV_IMAGE
  when: manual
  variables:
    EXAMPLE_MODEL_GCP_PROJECT: $PROD_PROJECT
    EXAMPLE_MODEL_REGION: $REGION
    EXAMPLE_MODEL_REPORTS_BUCKET: $REPORTS_BUCKET
    EXAMPLE_MODEL_ALERT_EMAILS: '["ml-alerts@example.com"]'
    MODEL_VERSION: ""   # set when starting the job: the registry version ID
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - test -n "$MODEL_VERSION" || { echo "set MODEL_VERSION"; exit 1; }
    - uv run --isolated --no-project --index-url "$PYPI_RELEASE_INDEX"
        --with "$PACKAGE[gcp]==$VERSION"
        example-model promote --version "$MODEL_VERSION"
