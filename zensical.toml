[project]
site_name = "Handbook"
site_description = "How this team works: the business, the platform, the models, the conventions."
site_url = "https://example.com/handbook/"
# repo_url = "https://github.com/org/handbook"
# edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"
# Watch facts and includes so `serve` rebuilds when they change.
watch = ["facts", "includes"]

nav = [
  { "Home" = "index.md" },
  { "Business" = [
    { "Overview" = "business/index.md" },
  ] },
  { "Data" = [
    { "Overview" = "data/index.md" },
  ] },
  { "Methods" = [
    { "Overview" = "methods/index.md" },
    { "Development" = [
      { "Overview" = "methods/development/index.md" },
      { "Style guides" = "methods/development/style-guide.md" },
      { "Conventions" = "methods/development/conventions.md" },
    ] },
  ] },
  { "Technology" = [
    { "Overview" = "technology/index.md" },
    { "Development tools" = "technology/tools.md" },
  ] },
  { "Team" = [
    { "Overview" = "team/index.md" },
    { "How we work" = "team/how-we-work.md" },
    { "Onboarding" = "team/onboarding.md" },
    { "Decisions" = [
      { "Overview" = "team/decisions/index.md" },
    ] },
  ] },
  { "Insights" = "insights/index.md" },
  { "Glossary" = "glossary/index.md" },
  { "Apps" = "apps/index.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

# Default palette: system preference with a toggle.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# Alternate palette: green primary, gold accent. To use it, add the two
# lines below to each palette block above (or to a single block without
# `media` for a fixed scheme), then adjust the custom colours in
# docs/stylesheets/extra.css if you want exact brand values.
#   primary = "green"
#   accent = "amber"

[project.plugins.macros]
include_yaml = [
  "facts/kpis.yaml",
  "facts/data.yaml",
  "facts/platform.yaml",
  "facts/team.yaml",
  "facts/apps.yaml",
  "facts/insights.yaml",
]

[project.plugins.tags]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets.base_path = ["includes", "."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
