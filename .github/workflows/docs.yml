name: docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group docs
      - name: Front matter schema
        run: uv run --group docs python scripts/validate_frontmatter.py docs
      - name: Markdown lint
        run: uv run --group docs pymarkdown --config .pymarkdown.json scan -r docs
      - name: Build
        run: uv run --group docs zensical build
      - name: Stage site under its base path
        # site_url in zensical.toml ends in /handbook/, so the built pages use
        # root-relative links like /handbook/team/. Placing the site at
        # _check/handbook lets the link check resolve them from _check.
        run: mkdir -p _check && mv site _check/handbook
      - name: Link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir _check _check/handbook
          fail: true
      - name: Stale pages (informational)
        run: uv run --group docs python scripts/stale_report.py docs
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _check/handbook
